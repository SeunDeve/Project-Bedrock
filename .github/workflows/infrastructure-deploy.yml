name: Project Bedrock — Infrastructure

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main, staging/project-bedrock]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.11.0'
  CLUSTER_NAME: project-bedrock-cluster
  WORKING_DIR: terraform

jobs:
  # ── Job 1: Validate ────────────────────────────────────────────────────────
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ── Job 2: Plan ────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with S3 backend
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=project-bedrock/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Create tfvars
        run: |
          python3 -c "
          content = '''
          aws_region         = \"us-east-1\"
          project_name       = \"project-bedrock\"
          cluster_name       = \"project-bedrock-cluster\"
          student_id         = \"${{ secrets.STUDENT_ID }}\"
          vpc_cidr           = \"10.20.0.0/16\"
          azs                = [\"us-east-1a\", \"us-east-1b\"]
          budget_alert_email = \"${{ secrets.BUDGET_ALERT_EMAIL }}\"
          '''
          open('terraform.tfvars', 'w').write(content)
          "

      - name: Plan
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  # ── Job 3: Apply ───────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with S3 backend
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=project-bedrock/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Apply
        run: terraform apply -auto-approve tfplan

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}
          kubectl get nodes

      - name: Print outputs
        run: terraform output

      - name: Deployment summary
        if: always()
        run: |
          echo "## Project Bedrock Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | $(terraform output -raw cluster_name 2>/dev/null || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | $(terraform output -raw cluster_endpoint 2>/dev/null || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          echo "| VPC | $(terraform output -raw vpc_id 2>/dev/null || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY

  # ── Job 4: Destroy (manual only) ──────────────────────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init with S3 backend
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=project-bedrock/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Create tfvars
        run: |
          python3 -c "
          content = '''
          aws_region         = \"us-east-1\"
          project_name       = \"project-bedrock\"
          cluster_name = \"project-bedrock-cluster\"
          student_id   = \"${{ secrets.STUDENT_ID }}\"
          vpc_cidr     = \"10.20.0.0/16\"
          azs          = [\"us-east-1a\", \"us-east-1b\"]
          '''
          open('terraform.tfvars', 'w').write(content)
          "

      - name: Destroy
        run: terraform destroy -var-file=terraform.tfvars -auto-approve